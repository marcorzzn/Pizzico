# Pizzico — crates/wasm-bindings/Cargo.toml
# Riferimento manifesto: §3.1, §4, §6.2, §11 Step 8
# Licenza: MIT OR Apache-2.0

[package]
name = "pizzico-wasm-bindings"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings and bridge between Rust engine and TypeScript UI shell"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pizzico-core   = { path = "../core" }
pizzico-render = { path = "../render" }
pizzico-commands = { path = "../commands" }
pizzico-io-psd = { path = "../io-psd" }
pizzico-io-native = { path = "../io-native" }
pizzico-raster = { path = "../raster" }
# Catalogo dichiarativo degli strumenti: dati validati, nessuna dipendenza dal motore.
pizzico-tools = { path = "../tools" }

# Motore trapiantato da Pizzart (Fase 4.2). Opzionali: si attivano con `engine-v2`.
pizzico-engine-core = { path = "../engine/core", optional = true }
pizzico-engine-render = { path = "../engine/render", optional = true }
pizzico-engine-io = { path = "../engine/io", optional = true }

# WASM / JS bridge
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "console",
    "Window",
    "Document",
    "Element",
    "Navigator",
] }

# panic hook per debug WASM in DevTools
console_error_panic_hook = "0.1"

# Utilità runtime
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[features]
default = []
# Attiva il backend v2 (`pizzico-engine-core`) al posto del motore legacy.
# Le funzioni che dipendono da formati legacy (PSD, .pizzico) restano escluse e
# vanno dichiarate: vedi docs/audit/fase-4-2-2.md.
engine-v2 = ["dep:pizzico-engine-core", "dep:pizzico-engine-render", "dep:pizzico-engine-io"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-mutable-globals"]
