# Pizzico — .github/workflows/deploy-web.yml
# Riferimento manifesto: §3.1, §3.2, §3.3, §11 Step 5
# Licenza: MIT OR Apache-2.0

name: Deploy Web & PWA to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Web Application
        run: pnpm --filter @pizzico/app-web build

      - name: Verify COOP/COEP Headers File
        run: |
          test -f apps/web/dist/_headers || cp apps/web/public/_headers apps/web/dist/_headers
          echo "COOP/COEP Headers verified for SharedArrayBuffer multithreading."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'pizzico'
          directory: 'apps/web/dist'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
