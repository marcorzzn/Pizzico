# Pizzico — .github/workflows/ci.yml
# Riferimento manifesto: §3.1, §3.3, §11 Step 5
# Licenza: MIT OR Apache-2.0

name: CI Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rust-check:
    name: Rust Workspace Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        run: cargo check --workspace --all-targets

      - name: Cargo Test
        run: cargo test --workspace

  typescript-check:
    name: TypeScript & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test-wasm:
    name: WebAssembly Build & Web Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM Package
        run: wasm-pack build crates/wasm-bindings --target web --out-dir ../../packages/worker-core/pkg

      - name: Build Web Application
        run: pnpm --filter @pizzico/app-web build

      - name: Verify Web Dist Artifacts (WASM & COOP/COEP headers)
        run: |
          test -f apps/web/dist/_headers
          grep -q "Cross-Origin-Opener-Policy: same-origin" apps/web/dist/_headers
          grep -q "Cross-Origin-Embedder-Policy: require-corp" apps/web/dist/_headers
          ls -lh apps/web/dist/assets/*.wasm
          echo "✅ All WASM and security header artifacts verified in dist/"

      # Playwright vive in una directory isolata: il workspace non guadagna
      # una dipendenza solo per il gate, e la versione resta pinnata qui.
      - name: Install Playwright (isolated)
        env:
          PLAYWRIGHT_VERSION: 1.64.1
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"

      # Carica l'app con la stessa CSP di Tauri: se WebAssembly non compila
      # sotto quella policy, il job fallisce (v0.1.2 sarebbe passata di qui).
      - name: Runtime WASM smoke (headless Chromium)
        run: node tests/e2e/wasm-runtime.mjs

