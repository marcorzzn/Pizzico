# Riferimento manifesto: §3.1, §3.3, §11 Step 5
# Licenza: MIT OR Apache-2.0

name: CI Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rust-check:
    name: Rust Workspace Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        run: cargo check --workspace --all-targets

      - name: Cargo Test
        run: cargo test --workspace

  typescript-check:
    name: TypeScript & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: pnpm typecheck

  test-wasm:
    name: WebAssembly Build & Web Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build WASM Package
        run: wasm-pack build crates/wasm-bindings --target web --out-dir ../../packages/worker-core/pkg

      - name: Build Web Application
        run: pnpm --filter @pizzico/app-web build

      - name: Verify Web Dist Artifacts (WASM & COOP/COEP headers)
        run: |
          test -f apps/web/dist/_headers
          grep -q "Cross-Origin-Opener-Policy: same-origin" apps/web/dist/_headers
          grep -q "Cross-Origin-Embedder-Policy: require-corp" apps/web/dist/_headers
          ls -lh apps/web/dist/assets/*.wasm
          echo "✅ All WASM and security header artifacts verified in dist/"

